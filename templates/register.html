<!DOCTYPE html>
<html>
<head>
<title>Register</title>
<style>
/* SAME STYLE */
body { margin:0;font-family:'Courier New';height:100vh;display:flex;justify-content:center;align-items:center;
background: linear-gradient(-45deg,#ff00cc,#3333ff,#00ffcc,#ff6600);background-size:400% 400%;animation:bgMove 8s infinite alternate;}
@keyframes bgMove {0%{background-position:0%}100%{background-position:100%}}
.container{background:rgba(0,0,0,0.85);padding:40px;border-radius:20px;text-align:center;box-shadow:0 0 40px #00ffcc;}
h1{color:#00ffcc;text-shadow:0 0 15px #00ffcc;}
input{padding:12px;width:250px;margin:10px;border-radius:10px;border:none;}
button{padding:10px 20px;background:#00ffcc;border:none;border-radius:10px;}
#strength{height:10px;width:250px;background:#555;margin:auto;}
</style>
</head>
<body>

<div class="container">
<h1>Register</h1>

<form action="/save" method="POST">
<input type="text" name="username" placeholder="Username" required><br>
<input type="password" id="password" name="password" placeholder="Password" required><br>

<div id="strength"></div>

<button type="submit">Store</button>
</form>

<br>
<button onclick="location.href='/'">Back</button>

</div>

<script>
const p=document.getElementById('password');
const bar=document.getElementById('strength');

p.addEventListener('input',()=>{
let v=p.value;
let s=0;

if(v.length>=6)s++;
if(/[A-Z]/.test(v))s++;
if(/[0-9]/.test(v))s++;
if(/[^A-Za-z0-9]/.test(v))s++;

const colors=["#555","red","orange","yellow","lime"];
bar.style.width=(s*25)+"%";
bar.style.background=colors[s];
});
</script>

</body>
</html>
