<!DOCTYPE html>
<html>
<head>
<title>PASSWORD MANAGER</title>
<style>
body {
    margin:0;
    font-family:'Courier New';
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(-45deg,#ff00cc,#3333ff,#00ffcc,#ff6600);
    background-size:400% 400%;
    animation:bgMove 8s infinite alternate;
}
@keyframes bgMove {
    0%{background-position:0%}
    100%{background-position:100%}
}
.container{
    background:rgba(0,0,0,0.85);
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 40px #00ffcc;
}
h1{
    color:#00ffcc;
    text-shadow:0 0 15px #00ffcc;
}
button{
    display:block;
    width:250px;
    margin:15px auto;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#00ffcc;
    font-weight:bold;
    cursor:pointer;
}
button:hover{
    background:#00ffaa;
    transform:scale(1.1);
}
</style>
</head>
<body>

<div class="container">
    <h1>🔐 PASSWORD MANAGER</h1>

    <button onclick="location.href='/register'">Register Password</button>
    <button onclick="location.href='/view'">View Passwords</button>
    <button onclick="location.href='/decode'">Decode Password</button>
    <button onclick="location.href='/strength'">Check Strength</button>
</div>

</body>
</html>
