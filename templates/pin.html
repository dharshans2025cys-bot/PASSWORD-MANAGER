<!DOCTYPE html>
<html>
<head>
<title>Enter PIN</title>
<style>
body {
    margin:0;
    font-family:'Courier New';
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background: linear-gradient(-45deg,#ff00cc,#3333ff,#00ffcc,#ff6600);
    background-size:400% 400%;
    animation:bgMove 8s infinite alternate;
}
@keyframes bgMove {0%{background-position:0%}100%{background-position:100%}}

.container{
    background:rgba(0,0,0,0.85);
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 0 40px #00ffcc;
}
h1{color:#00ffcc}

input{
    padding:10px;
    width:200px;
    border-radius:10px;
    border:none;
    margin-top:10px;
}

button{
    margin-top:15px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#00ffcc;
    cursor:pointer;
}

p{color:red}
</style>
</head>
<body>

<div class="container">

<h1>🔐 PIN Access</h1>

{% if setup %}
<p style="color:#00ffcc">Set your PIN</p>
{% endif %}

{% if error %}
<p>{{error}}</p>
{% endif %}

<form method="POST">
    <input type="password" name="pin" placeholder="Enter PIN" required><br>
    <button type="submit">Submit</button>
</form>

<br>
<button onclick="location.href='/'">Back</button>

</div>

</body>
</html>
